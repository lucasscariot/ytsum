[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ytsum"
version = "0.1.1"
description = "Readable YouTube summaries using ytt and local Ollama models"
requires-python = ">=3.12"
dependencies = ["pyperclip>=1.9,<2", "rich>=13.9,<15"]

[project.scripts]
ytsum = "ytsum.cli:main"

[tool.ruff]
line-length = 100
